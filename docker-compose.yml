# Dev:   `make db`  → only Postgres; run the API and web on your laptop (make api / make web).
# Full:  `make up`  → Postgres + API + web, all in Docker (profile "full").
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: daha
      POSTGRES_PASSWORD: daha
      POSTGRES_DB: daha
    ports:
      # Only this laptop can reach Postgres. The password above is in the repo, so on 0.0.0.0
      # anyone on the same Wi-Fi could read or change the data. The api container still
      # reaches it over Docker's internal network (db:5432).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - daha_pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daha -d daha"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    profiles: ["full"]
    build: ./backend
    env_file: ./backend/.env          # secrets stay in this file; it is never copied into the image
    environment:
      DATABASE_URL: postgresql+psycopg://daha:daha@db:5432/daha
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - daha_uploads:/app/uploads
      - daha_fastembed:/app/.fastembed_cache
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: ./web
      args:
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_MOCK: none
        NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-true}"
        # Feature switches, baked in at build time (the deploy sets them from backend/.env)
        NEXT_PUBLIC_THEME: "${NEXT_PUBLIC_THEME:-holiday}"
        NEXT_PUBLIC_CONDITION_CHECK: "${NEXT_PUBLIC_CONDITION_CHECK:-false}"
        NEXT_PUBLIC_HANDOFF_COORDINATOR: "${NEXT_PUBLIC_HANDOFF_COORDINATOR:-false}"
        NEXT_PUBLIC_VALUE_EXCHANGE: "${NEXT_PUBLIC_VALUE_EXCHANGE:-false}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  daha_pgdata:
  daha_uploads:
  daha_fastembed:
