services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: daha
      POSTGRES_PASSWORD: daha
      POSTGRES_DB: daha
    ports:
      - "5432:5432"
    volumes:
      - daha_pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daha -d daha"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  daha_pgdata:
