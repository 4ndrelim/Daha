# Runs on every PR and on main: backend (ruff + pytest on real Postgres/pgvector) and web
# (lint, typecheck, build). No paid AI: AI_PROVIDER=mock, EMBEDDINGS_PROVIDER=hash.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: daha
          POSTGRES_PASSWORD: daha
          POSTGRES_DB: daha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daha -d daha_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://daha:daha@localhost:5432/daha_test
      TEST_DATABASE_URL: postgresql+psycopg://daha:daha@localhost:5432/daha_test
      AI_PROVIDER: mock
      EMBEDDINGS_PROVIDER: hash
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # this action publishes no moving major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen   # generates LayoutProps/PageProps, which tsc needs on a fresh clone
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_MOCK: none
          NEXT_PUBLIC_DEMO_MODE: "true"
